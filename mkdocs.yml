site_name: STPulse — База знаний
site_url: https://docs.app-stpulse.ru

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - styles/stpulse.css

nav:
  - Главная: index.md

  - Начало работы:
      - Обзор: getting-started/overview.md
      - Регистрация и вход: getting-started/registration-login.md
      - Интерфейс: getting-started/interface.md
      - Тарифы: getting-started/tariffs.md
      - Тестовый период: getting-started/test-access.md

  - Магазин и интеграции:
      - Обзор: stores/overview.md
      - Создание магазина: stores/create-store.md
      - Seller API: stores/seller-api.md
      - Performance API: stores/performance-api.md
      - Налоги: stores/taxes.md

  - Пульс:
      - Главный дашборд: dashboard/overview.md

  - Финансы:
      - Обзор: finances/overview.md
      - Прибыли и убытки: finances/profit-and-loss.md
      - Движение денежных средств: finances/cashflow.md
      - Планирование: finances/planning.md
      - Себестоимость: reports/cost-price.md
      - Выкупы Озоном: reports/marketplace-buyouts.md

  - Аналитика:
      - Обзор: analytics/overview.md
      - Операционка: analytics/operations.md
      - Юнит-экономика: analytics/unit-economics.md
      - Журнал событий: analytics/events.md

  - Товары:
      - Обзор: products/overview.md
      - Модели артикулов: reports/models.md
      - Возвраты: analytics/returns.md
      - Реклама: ads/internal-ads.md

  - Логистика:
      - Обзор: supplies/overview.md
      - Планирование поставок: supplies/supply-planning.md
      - Остатки: supplies/stocks.md

  - Сценарии:
      - Обзор: scenarios/overview.md
      - Первая неделя: scenarios/first-week.md
      - Поиск убыточных товаров: scenarios/find-unprofitable-products.md
      - Эффективность рекламы: scenarios/ads-efficiency.md
      - План поставок на месяц: scenarios/supply-plan-month.md

  - FAQ и поддержка:
      - Обзор: faq/overview.md
      - Общие вопросы: faq/general-faq.md
      - Расхождение цифр с Ozon: faq/numbers-diff-faq.md
      - Вопросы по API: faq/api-faq.md
      - Как задать вопрос: support/how-to-ask.md
      - Контакты: support/contacts.md

extra:
  cname: docs.app-stpulse.ru

plugins:
  - search
  - mkdocs-breadcrumbs-plugin:
      delimiter: " / "
      use_page_titles: true
      home_text: "Главная"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji
  - tables
  - toc:
      permalink: true
